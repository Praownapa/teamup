server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ALB ใช้ path นี้ตรวจว่า container ยังทำงานอยู่ (target group health check)
  location = /health { return 200 'ok'; add_header Content-Type text/plain; }

  # config.js เปลี่ยนตาม environment ห้าม cache
  location = /config.js { add_header Cache-Control "no-store"; }

  # ไฟล์ใน /assets มี hash ในชื่อ cache ได้นาน
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # API traffic must be routed by ALB (no backend inside this container).
  location /api/ { return 404; }

  # SPA: ทุก path ที่ไม่ใช่ไฟล์จริงให้ส่ง index.html แล้ว React Router จัดการต่อ
  # (ถ้าไม่มีบรรทัดนี้ กดรีเฟรชที่ /projects/5 จะได้ 404)
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
