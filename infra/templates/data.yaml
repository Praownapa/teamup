AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TeamUp (des424-126-g07) data: the PostgreSQL database and its password, the cover-image bucket, the
  Cognito user pool, and the two container image repositories. Redeploying the app never replaces these
  (the deploy script sets a stack policy that forbids it).

Parameters:
  Prefix:
    Type: String
    Default: des424-126-g07-teamup
    Description: Start of every name, so it's clear in this shared account what belongs to TeamUp.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The network stack's private subnets (no internet route), for the database.
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The network stack's database firewall group (PostgreSQL from the backend only).

Resources:
  # The database's master user. AWS generates the password; nobody types it, and it isn't in git.
  # It is never rotated: ECS reads it only when a container starts. The name ends with part of this
  # stack's ID because a deleted secret's name stays reserved for 30 days.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - "${Prefix}-db-${StackSuffix}"
        - StackSuffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]]
      Description: TeamUp database master user (generated by AWS, never rotated)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"teamup"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\''' # characters RDS doesn't allow in a master password, plus quotes

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${Prefix}-db"
      DBSubnetGroupDescription: TeamUp database - private subnets only
      SubnetIds: !Ref PrivateSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete # deleting the setup keeps no final snapshot (it's demo and test data)
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${Prefix}-db"
      Engine: postgres
      EngineVersion: "17.9" # Tokyo's default PostgreSQL 17 (checked 2026-11-13); pinned, since minor upgrades are off
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBName: teamup
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId
      BackupRetentionPeriod: 1
      PreferredBackupWindow: "17:00-17:30" # 00:00-00:30 in Thailand
      PreferredMaintenanceWindow: "wed:18:00-wed:18:30" # Thursday 01:00 in Thailand, after the presentation
      AutoMinorVersionUpgrade: false # no surprise upgrade during the demo week
      DeletionProtection: false
      DeleteAutomatedBackups: true
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false

  # Cover images. Private: browsers upload with the backend's 5-minute presigned URLs and read the images
  # through CloudFront (the app stack adds the bucket policy for that).
  CoversBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete # the delete script empties it first
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${Prefix}-covers-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # The browser's upload is a cross-origin PUT. Any origin is fine: the presigned URL is the
      # credential, and the CloudFront address isn't known when this stack is created.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Prefix}-users"
      UserPoolTier: LITE # the cheapest feature plan; it covers sign-up, sign-in, groups and custom attributes
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # The same rule as the sign-up form (src/pages/Auth.jsx): 8+ characters, upper and lower case, a number.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # The sign-up form sends name, custom:student_id and custom:major.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: student_id
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "0", MaxLength: "32" }
        - Name: major
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "0", MaxLength: "100" }
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's built-in email sends the sign-up and password-reset codes (about 50 emails a day).
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your TeamUp verification code
        EmailMessage: "Your TeamUp verification code is {####}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      MfaConfiguration: "OFF"
      DeletionProtection: INACTIVE
      UserPoolTags:
        project: teamup
        owner: des424-126-g07

  # The website's sign-in client. No secret (a browser app can't keep one). The admin password flow
  # needs AWS credentials, so a browser can't use it; the smoke test and the demo-account script do.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Prefix}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # In Cognito mode the backend gives members of this group the admin role, on every request.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: TeamUp admins (the backend gives this group the admin role)

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Prefix}-backend"
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Prefix}-frontend"
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: teamup
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
  CoversBucketName:
    Value: !Ref CoversBucket
  CoversBucketArn:
    Value: !GetAtt CoversBucket.Arn
  CoversBucketRegionalDomainName:
    Value: !GetAtt CoversBucket.RegionalDomainName
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
