AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TeamUp (des424-126-g07) app: the backend and website containers on ECS Fargate, the load balancer
  (which only answers requests that come through our CloudFront), CloudFront (the one HTTPS address for the
  website, /api and the cover images), and the IAM roles and logs they need.

Parameters:
  Prefix:
    Type: String
    Default: des424-126-g07-teamup
    Description: Start of every name, so it's clear in this shared account what belongs to TeamUp.
  # From the network stack
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  BackendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  FrontendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  # From the data stack
  DatabaseEndpoint:
    Type: String
  DatabasePort:
    Type: String
  DatabaseName:
    Type: String
  DatabaseSecretArn:
    Type: String
  CoversBucketName:
    Type: String
  CoversBucketArn:
    Type: String
  CoversBucketRegionalDomainName:
    Type: String
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  # From the deploy script: <repository URI>:<git commit>
  BackendImage:
    Type: String
  FrontendImage:
    Type: String
  # From the deploy script (TEAMUP_EMAIL): the team inbox that TeamUp's emails come from
  EmailAddress:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address, or empty for no email
    Description: >-
      The team inbox TeamUp sends its emails from. Emails for the made-up demo addresses go to it too. SES
      emails it a verification link, and sending works once that link is clicked. Empty means no email.

Conditions:
  SendEmail: !Not [!Equals [!Ref EmailAddress, ""]]

Resources:
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${Prefix}/backend"
      RetentionInDays: 14

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${Prefix}/frontend"
      RetentionInDays: 14

  # Our own roles (the account's shared ecsTaskExecutionRole isn't ours to use or change).
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-ecs-execution"
      Description: Lets ECS pull TeamUp's images, write their logs and read the database password
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-backend-task"
      Description: What the TeamUp backend itself may do - put cover images into its bucket (presigning) and send email as the team address
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: upload-covers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${CoversBucketArn}/covers/*"
        - !If
          - SendEmail
          - PolicyName: send-email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ses:SendEmail
                  # identity/*: in the SES sandbox the recipient's verified address is checked too.
                  # The condition still allows sending only as the team address.
                  Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  Condition:
                    StringEquals:
                      ses:FromAddress: !Ref EmailAddress
          - !Ref AWS::NoValue

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: SendEmail
    Properties:
      EmailIdentity: !Ref EmailAddress # SES emails this address a verification link

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Prefix}"
      ClusterSettings:
        - Name: containerInsights
          Value: disabled # extra cost, not needed for the demo

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Prefix}-backend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512" # 0.5 vCPU
      Memory: "1024" # 1 GB
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64 # images are built on the user's x86-64 PC
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - { Name: AUTH_MODE, Value: cognito } # never dev in AWS
            - { Name: COGNITO_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref UserPoolId }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref UserPoolClientId }
            - { Name: UPLOAD_MODE, Value: s3 }
            - { Name: S3_BUCKET, Value: !Ref CoversBucketName }
            - { Name: S3_REGION, Value: !Ref AWS::Region }
            - { Name: PUBLIC_FILE_BASE_URL, Value: !Sub "https://${Distribution.DomainName}" }
            - { Name: SEED_DEMO_DATA, Value: "true" } # loads the demo data into an empty database
            - { Name: DB_HOST, Value: !Ref DatabaseEndpoint }
            - { Name: DB_PORT, Value: !Ref DatabasePort }
            - { Name: DB_NAME, Value: !Ref DatabaseName }
            - { Name: DB_SSLMODE, Value: require }
            - { Name: EMAIL_MODE, Value: !If [SendEmail, ses, "off"] }
            - { Name: EMAIL_REGION, Value: !Ref AWS::Region }
            - { Name: APP_URL, Value: !Sub "https://${Distribution.DomainName}" } # for the links in emails
            - !If [SendEmail, { Name: EMAIL_FROM, Value: !Ref EmailAddress }, !Ref AWS::NoValue]
            - !If [SendEmail, { Name: EMAIL_DEMO_INBOX, Value: !Ref EmailAddress }, !Ref AWS::NoValue]
          Secrets: # read from Secrets Manager when the container starts
            - Name: DB_USER
              ValueFrom: !Sub "${DatabaseSecretArn}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DatabaseSecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Prefix}-frontend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256" # 0.25 vCPU
      Memory: "512" # 0.5 GB
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          # docker-entrypoint.sh writes these into config.js (and pins sign-in to Cognito).
          Environment:
            - { Name: API_BASE_URL, Value: /api }
            - { Name: USE_MOCK, Value: "false" }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref UserPoolId }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref UserPoolClientId }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # The load balancer answers only requests that carry our CloudFront's secret header. Its firewall
  # already limits it to CloudFront's addresses; the header also shuts out other people's distributions.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Prefix}"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Prefix}-api"
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health # 200 only when the API can reach the database
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Prefix}-web"
      TargetType: ip
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: # anything without our CloudFront's header
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Forbidden

  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/api/*"]
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Select [2, !Split ["/", !Ref AWS::StackId]] # the same value CloudFront sends
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  WebRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 20
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Select [2, !Split ["/", !Ref AWS::StackId]]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: ApiRule
    Properties:
      ServiceName: !Sub "${Prefix}-backend"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120 # migrations and the demo data load run at startup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100 # the old task keeps serving until the new one is healthy
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # reaches ECR, Cognito, S3 and Secrets Manager without a NAT gateway
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref BackendSecurityGroupId
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref BackendTargetGroup
      PropagateTags: SERVICE
      EnableECSManagedTags: true

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: WebRule
    Properties:
      ServiceName: !Sub "${Prefix}-frontend"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref FrontendSecurityGroupId
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      PropagateTags: SERVICE
      EnableECSManagedTags: true

  # /api/* is never cached (TTL 0), but the Authorization header and query strings must reach the
  # backend: putting them in the cache key is how CloudFront forwards them.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${Prefix}-api"
        Comment: TeamUp API - never cached; Authorization and query strings reach the backend
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          QueryStringsConfig:
            QueryStringBehavior: all
          CookiesConfig:
            CookieBehavior: none

  CoversOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Prefix}-covers"
        Description: Lets TeamUp's CloudFront read the private cover-image bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TeamUp (des424-126-g07)
        PriceClass: PriceClass_200 # includes edge locations in Asia
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Select [2, !Split ["/", !Ref AWS::StackId]] # stable for this stack, unguessable
          - Id: covers
            DomainName: !Ref CoversBucketRegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: "" # empty: access goes through the origin access control
            OriginAccessControlId: !GetAtt CoversOriginAccessControl.Id
        # The website. nginx's own headers decide caching: /assets/* (hashed names) for a year, and
        # index.html, config.js and deep links not at all, so a redeploy shows up right away.
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 83da9c7e-98b4-4e11-a168-04f0df8e2c65 # managed: UseOriginCacheControlHeaders
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # managed: AllViewerExceptHostHeader
            Compress: false
          - PathPattern: /covers/*
            TargetOriginId: covers
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed: CachingOptimized
            Compress: true
        # Never keep an error: by default CloudFront would serve a cached 4xx/5xx for 10 seconds.
        CustomErrorResponses:
          - { ErrorCode: 400, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 403, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 405, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 414, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 416, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 501, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }

  # Only our CloudFront distribution may read the cover images (the bucket stays private).
  CoversBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CoversBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${CoversBucketArn}/covers/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  SiteUrl:
    Description: TeamUp's address
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  BackendServiceName:
    Value: !GetAtt BackendService.Name
  BackendTaskFamily:
    Value: !Sub "${Prefix}-backend"
